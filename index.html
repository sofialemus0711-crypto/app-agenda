<!doctype html>
<html lang="es">

  <meta name="theme-color" content="#F7F4EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Mi Agenda">

<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación">
      <a class="brand" href="#semana">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Mi Agenda</span>
      </a>
      <nav class="side-nav">
        <a href="#semana" data-nav="semana">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
          <span>Mi semana</span>
        </a>
        <a href="#eventos" data-nav="eventos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>

        <span class="brand-name">Mi Agenda</span>
      </a>
      <button type="button" class="icon-btn sync-icon" data-sync aria-label="Sincronización">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 18.5z"/></svg>
        <span class="sync-dot" aria-hidden="true"></span>
      </button>

    <main id="view" class="main"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#semana" data-nav="semana">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>

      </a>
